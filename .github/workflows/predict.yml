name: Generar predicciones NFL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: modelo-nfl run
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-predictions
          path: |
            data/edgebook-latest.json
            data/history/
            data/context/
            data/advanced-sources.json
            data/raw/source.json
