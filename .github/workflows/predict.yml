name: Generar predicciones NFL
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Comitear la emisión generada a la rama que ejecuta'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: modelo-nfl run
      # Resumen legible del ajuste por QB probable: queda en el log de la ejecución.
      - run: python scripts/report_qb_news.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-predictions
          path: |
            data/edgebook-latest.json
            data/history/
            data/context/
            data/advanced-sources.json
            data/raw/source.json
      # Publicar es explícito: sin esta opción la ejecución solo deja el artefacto.
      - name: Publicar emisión en la rama
        if: ${{ inputs.publish }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/edgebook-latest.json data/history data/context data/advanced-sources.json
          git diff --cached --quiet && echo 'Sin cambios que publicar' && exit 0
          git commit -m "Publicar emisión NFL $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:${GITHUB_REF_NAME}
